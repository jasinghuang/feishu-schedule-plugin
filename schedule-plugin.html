<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>拍摄排期 · v2</title>
  <link rel="stylesheet" href="./schedule.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div><p class="eyebrow">主播 × 摄影师</p><h1>拍摄排期</h1><p id="connection" class="muted" role="status">正在连接飞书…</p></div>
      <div class="week-total"><span id="total-label">当周完成拍摄</span><strong id="total">—</strong><span id="total-meta">条</span></div>
    </header>
    <div class="toolbar">
      <div class="week-nav" aria-label="选择拍摄周次"><button id="previous-week" aria-label="上一周">‹</button><label class="week-picker"><span id="week-label">本周</span><input id="week-date" type="date" aria-label="选择日期查看所在周"></label><button id="next-week" aria-label="下一周">›</button><button id="this-week" class="quiet">本周</button></div>
      <div class="actions"><button id="refresh">刷新</button><button id="settings" hidden>摄影师设置</button><button id="new-shoot" class="primary" hidden>新增拍摄</button></div>
    </div>
    <div id="error" class="error-banner" role="alert" hidden></div>
    <div id="notice" class="notice" role="status" hidden></div>
    <div class="view-bar"><div class="tabs" role="tablist" aria-label="排期查看方式"><button id="shoot-tab" class="selected" role="tab" aria-selected="true" aria-controls="shoot-panel">按拍摄查看</button><button id="matrix-tab" role="tab" aria-selected="false" aria-controls="matrix-panel">摄影师矩阵</button></div><button id="export" class="quiet" disabled>导出该周</button></div>
    <section id="shoot-panel" role="tabpanel" aria-labelledby="shoot-tab"><div id="shoot-list" class="empty">正在读取排期…</div></section>
    <section id="matrix-panel" role="tabpanel" aria-labelledby="matrix-tab" hidden><div id="matrix"></div></section>
    <p id="week-range" class="footnote"></p>
  </main>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="shoot-form">
      <header class="dialog-header"><div><p id="editor-subtitle" class="muted">每周排期</p><h2 id="editor-title">新增拍摄</h2></div><button type="button" data-close="editor" class="icon-button" aria-label="关闭拍摄记录">×</button></header>
      <div class="form-grid">
        <label>日期<input id="shoot-date" type="date" required></label>
        <label>主播<select id="shoot-host" required></select></label>
        <fieldset><legend>时间段</legend><div id="period-choices" class="choices"></div></fieldset>
        <fieldset><legend>参与摄影师</legend><div id="photo-choices" class="choices"></div></fieldset>
        <label class="full">脚本<textarea id="shoot-script" rows="4" placeholder="粘贴脚本文档链接或脚本内容"></textarea></label>
        <label>实拍条数<input id="shoot-count" type="number" min="0" step="1" placeholder="未填报"></label>
      </div>
      <div id="editor-error" class="form-error" role="alert" hidden></div>
      <footer class="dialog-footer"><button id="cancel-shoot" type="button" class="danger" hidden>取消整场拍摄</button><button id="open-base" type="button" class="quiet" hidden>在飞书表中查看</button><span class="spacer"></span><button type="button" data-close="editor">关闭</button><button id="save-shoot" class="primary" type="submit">保存</button></footer>
    </form>
  </dialog>
  <dialog id="slot-dialog" aria-labelledby="slot-title"><header class="dialog-header"><h2 id="slot-title">摄影师时段</h2><button data-close="slot-dialog" class="icon-button" aria-label="关闭时段设置">×</button></header><div class="slot-options"><button id="slot-new" class="primary">安排新拍摄</button><label>加入该时段已有拍摄<select id="slot-existing"></select></label><button id="slot-join">加入拍摄</button><label class="check-label"><input id="slot-leave" type="checkbox">该时段请假</label><p id="slot-error" class="form-error" role="alert" hidden></p></div></dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title"><header class="dialog-header"><h2 id="settings-title">本周上岗摄影师</h2><button data-close="settings-dialog" class="icon-button" aria-label="关闭摄影师设置">×</button></header><div id="roster" class="roster"></div><p class="footnote">上岗调整不改变已安排的拍摄记录。</p></dialog>
  <dialog id="cancel-dialog" aria-labelledby="cancel-title"><form id="cancel-form"><header class="dialog-header"><h2 id="cancel-title">取消这场拍摄？</h2></header><p>取消后会删除这条未填报拍摄记录，并释放全部参与摄影师的时段。</p><footer class="dialog-footer"><button type="button" data-close="cancel-dialog">保留拍摄</button><button type="submit" class="danger">确认取消</button></footer></form></dialog>
  <script type="module" src="./schedule-app.mjs"></script>
</body>
</html>
